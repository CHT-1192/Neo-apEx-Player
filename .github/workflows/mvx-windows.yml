name: MVX (Windows)

# Renders music with the ORIGINAL MVX synthesiser.
#
# MVX is closed source: the apEx release ships mvx.h plus x86-32 MSVC static
# libraries, and nothing else.  It therefore cannot be ported to the player's own
# platforms, but it does not need to be - it runs natively on 32-bit Windows, and
# GitHub's windows-latest runners execute x86-32 through WoW64.  That makes this
# job the one place the real synth can be run at all.
#
# The result is a WAV (to listen to) and the tool's own SoundCache container
# (the file the portable player actually consumes: it carries the tick markers
# the clock is driven from).  The player picks a track up from disk with
# `--music`; picture and sound then share one timebase.
#
# The song data under demo/music/ is Conspiracy's, released under CC BY-NC 4.0:
# redistribution with attribution, no commercial use.  See LICENSES.md.

# Manual only (Actions -> MVX (Windows) -> Run workflow).
#
# This is a tool you run when you want the files, not a check that a commit can
# break: nothing in the repository consumes the output, and the song data changes
# about once in the life of the project.  Triggering it on push once produced
# 2.57 GB of Actions storage for thirty commits that nobody downloaded.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Render just one song (file name without .mvm), or leave empty for all"
        required: false
        default: ""
      upload:
        description: "Upload the SoundCaches as artifacts (roughly 40 MB each, kept 3 days)"
        type: choice
        options: ["false", "true"]
        default: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # One entry per .mvm the apEx release ships, which is one per bundled project
  # plus two alternates.  Keeping the list here rather than deriving it means a
  # typo fails loudly instead of silently rendering eight of ten.
  ALL_SONGS: >-
    step010padding step010 unintendedconsequence016 e0015_roughmaster
    off0021_things purge015-sh purge015 dissipate_007c_noglitch
    veins022-rc3 impending-013-fullcut
  # These five kill the closed-source synthesiser inside
  # mvxSystem_LoadMusic: it prints the file banner and then dies without a
  # message, having written nothing.  Exit code 0, so a step that only checked
  # errorlevel saw a success.  There is no source in the release to fix it --
  # third_party/apEx/MVX is mvx.h and nothing else -- so they are recorded here
  # rather than pretending to render them.
  KNOWN_UNLOADABLE: >-
    purge015 purge015-sh unintendedconsequence016 e0015_roughmaster
    impending-013-fullcut

jobs:
  pick:
    # A matrix cannot be computed from an input directly, so this tiny job turns
    # "all" or "one" into the list the render jobs fan out over.
    runs-on: ubuntu-latest
    outputs:
      songs: ${{ steps.list.outputs.songs }}
    steps:
      - id: list
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -eu
          songs="${{ env.ALL_SONGS }}"
          if [ -n "$ONLY" ]; then
            case " $songs " in
              *" $ONLY "*) songs="$ONLY" ;;
              *) echo "::error title=unknown song::'$ONLY' is not in the list: $songs"; exit 1 ;;
            esac
          fi
          json=$(printf '%s\n' $songs | sed 's/.*/"&"/' | paste -sd, -)
          echo "songs=[$json]" >> "$GITHUB_OUTPUT"
          echo "rendering: $songs"

  render-music:
    needs: pick
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        song: ${{ fromJSON(needs.pick.outputs.songs) }}
    # A song in KNOWN_UNLOADABLE is expected to die in the synth.  It still runs,
    # so a regression that makes one of the five WORK is visible too, but it does
    # not paint the whole matrix red.
    # Inline, not env.KNOWN_UNLOADABLE: the `env` context is not available to
    # continue-on-error, and GitHub rejects the workflow rather than ignoring it.
    # Spaces around the needle keep "purge015" from matching "purge015-sh".
    continue-on-error: ${{ contains(' purge015 purge015-sh unintendedconsequence016 e0015_roughmaster impending-013-fullcut ', format(' {0} ', matrix.song)) }}

    steps:
      - uses: actions/checkout@v4

      # The libraries are x86-32, so the toolchain must be too.  This is the
      # whole point of the job: WoW64 lets a 64-bit Windows runner execute them.
      - name: Set up 32-bit MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Show the toolchain
        run: |
          rem clang-cl, not cl: the same ABI and the same headers, a different
          rem front end.  The libraries are MSVC-built and link either way.
          clang-cl --version
          cl 2>&1 | findstr /C:"Version"
          dumpbin /headers third_party\apEx\Libraries\MVX\mvxPlayerLib_vs2019_releasestatic.lib 2>&1 | findstr /C:"machine" | findstr /C:"14C" && echo "library is i386 as expected"

      - name: Build the offline renderer
        # cmd, not the default PowerShell: `^` is cmd's line continuation, and
        # PowerShell hands it to cl as a source file ("cannot open input file
        # '^.obj'").  This step is also the i386 check - cl running in an x86
        # environment is what proves the toolchain matches the libraries.
        shell: cmd
        run: |
          rem The library predates the Universal CRT: it imports __imp__rand and
          rem __except_handler4_common from msvcrt.dll, so linking it against the
          rem default UCRT fails with LNK2019.  Select the legacy import library
          rem explicitly (msvcrt.lib) and drop libucrt from the default set.
          clang-cl /nologo /EHsc /O2 /W3 ^
             /I third_party\apEx\Libraries\MVX ^
             tools\mvx_render.cpp ^
             third_party\apEx\Libraries\MVX\mvxPlayerLib_vs2019_releasestatic.lib ^
             /link /NODEFAULTLIB:libucrt.lib /NODEFAULTLIB:libvcruntime.lib ^
             msvcrt.lib legacy_stdio_definitions.lib oldnames.lib ^
             dsound.lib winmm.lib ^
             /OUT:mvx_render.exe
          dir mvx_render.exe

      - name: Render ${{ matrix.song }}
        id: render
        # cmd, not bash: a loader failure (a missing import, say) surfaces as
        # exit 127 "command not found" under Git Bash, which says nothing about
        # why.  cmd prints the real Windows error.
        shell: cmd
        run: |
          rem Two outputs: a WAV to listen to, and the tool's own SoundCache
          rem container, which the player discovers on its own.
          dir demo\music\${{ matrix.song }}.mvm
          mvx_render.exe demo\music\${{ matrix.song }}.mvm ${{ matrix.song }}.wav ${{ matrix.song }}.apxsndcache
          rem The synth can exit 0 having written nothing (it faults inside
          rem mvxSystem_LoadMusic), so errorlevel alone is not evidence.  Demand
          rem the files.
          if not exist ${{ matrix.song }}.wav (
            echo ::error title=synth produced nothing::${{ matrix.song }}: no WAV written. If this song is in KNOWN_UNLOADABLE, that is the known failure.
            exit /b 1
          )
          if not exist ${{ matrix.song }}.apxsndcache (
            echo ::error title=synth produced nothing::${{ matrix.song }}: no SoundCache written.
            exit /b 1
          )
          dir ${{ matrix.song }}.wav ${{ matrix.song }}.apxsndcache

      - name: Check the render is real audio
        shell: pwsh
        run: |
          # A song that came out as zeros would mean the harness linked but the
          # mixer never actually ran, which a byte count alone cannot tell.
          $name = "${{ matrix.song }}"
          $wav = "$name.wav"
          $bytes = [System.IO.File]::ReadAllBytes($wav)
          if ($bytes.Length -lt 44) { throw "$name.wav is only $($bytes.Length) bytes" }

          # Duration comes from the file, not from a constant: the songs differ
          # in length by an order of magnitude, and the point of this check is
          # that the mixer ran to the end of THIS one.
          $seconds = [Math]::Round(($bytes.Length - 44) / 4 / 44100, 1)
          if ($seconds -lt 10) { throw "$name.wav is $seconds s long, which is not a song" }

          $nonzero = 0; $peak = 0
          for ($i = 44; $i -lt $bytes.Length - 1; $i += 512) {
            # [int] first: ToInt16 returns Int16, and Abs(-32768) on Int16
            # throws "negating the minimum value of a twos complement number is
            # invalid" - which a clippy mix produces constantly.
            $v = [Math]::Abs([int][System.BitConverter]::ToInt16($bytes, $i))
            if ($v -ne 0) { $nonzero++ }
            if ($v -gt $peak) { $peak = $v }
          }
          if ($nonzero -eq 0) { throw "$name.wav is silent" }
          if ($peak -lt 1000) { throw "$name.wav peaks at only $peak, which is not music" }

          # The cache container must carry the same payload plus the tick markers.
          $c = [System.IO.File]::ReadAllBytes("$name.apxsndcache")
          $magic = [System.Text.Encoding]::ASCII.GetString($c, 0, 4)
          if ($magic -ne "!CSA") { throw "cache magic is '$magic', expected '!CSA'" }

          $line = "| {0} | {1} s | {2} MB | peak {3} | {4} MB cache, {5} bytes |" -f `
                  $name, $seconds, [Math]::Round($bytes.Length/1MB,1), $peak,
                  [Math]::Round($c.Length/1MB,1), $c.Length
          Write-Host $line
          $line | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload the rendered music
        # Off by default: ten of these is ~400 MB of Actions storage for files
        # that are reproducible by re-running this job.
        if: inputs.upload == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: music-${{ matrix.song }}
          path: |
            ${{ matrix.song }}.wav
            ${{ matrix.song }}.apxsndcache
          # Three days, not thirty.
          retention-days: 3
