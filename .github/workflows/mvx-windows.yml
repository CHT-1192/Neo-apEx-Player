name: MVX (Windows)

# Renders the demo's music with the ORIGINAL MVX synthesiser.
#
# MVX is closed source: the apEx release ships mvx.h plus x86-32 MSVC static
# libraries, and nothing else.  It therefore cannot be ported to the player's own
# platforms, but it does not need to be - it runs natively on 32-bit Windows, and
# GitHub's windows-latest runners execute x86-32 through WoW64.  That makes this
# job the one place the real synth can be run as part of the build.
#
# The result is a WAV, uploaded as an artifact, which the portable player then
# plays with `--music` (its clock follows the audio play cursor, so picture and
# sound share a timebase).
#
# The .mvm is committed at demo/step010padding.mvm.  It is Conspiracy's released
# music data under CC BY-NC 4.0, which restricts commercial use but permits
# redistribution with attribution, so shipping it here is what lets this job run
# the real synthesiser instead of a stub.

# Manual only (Actions -> MVX (Windows) -> Run workflow).
#
# This job renders the demo's music with the closed-source Windows synthesiser.
# It is a tool you run when you want the file, not a check that a commit can
# break: the player's tests do not read the result, and the .mvm it consumes
# changes about once in the life of the project.  Triggering it on push meant
# ~87 MB of artifact per commit and 2.57 GB of Actions storage for thirty
# commits, none of which anything in the repository ever downloaded.
#
# If a change does need a render, run it from the Actions tab; the artifact is
# kept for three days.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-music:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      # The libraries are x86-32, so the toolchain must be too.  This is the
      # whole point of the job: WoW64 lets a 64-bit Windows runner execute them.
      - name: Set up 32-bit MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Show the toolchain
        run: |
          cl 2>&1 | findstr /C:"Version"
          dumpbin /headers third_party\apEx\Libraries\MVX\mvxPlayerLib_vs2019_releasestatic.lib 2>&1 | findstr /C:"machine" | findstr /C:"14C" && echo "library is i386 as expected"

      - name: Build the offline renderer
        # cmd, not the default PowerShell: `^` is cmd's line continuation, and
        # PowerShell hands it to cl as a source file ("cannot open input file
        # '^.obj'").  This step is also the i386 check - cl running in an x86
        # environment is what proves the toolchain matches the libraries.
        shell: cmd
        run: |
          rem The library predates the Universal CRT: it imports __imp__rand and
          rem __except_handler4_common from msvcrt.dll, so linking it against the
          rem default UCRT fails with LNK2019.  Select the legacy import library
          rem explicitly (msvcrt.lib) and drop libucrt from the default set.
          cl /nologo /EHsc /O2 /W3 ^
             /I third_party\apEx\Libraries\MVX ^
             tools\mvx_render.cpp ^
             third_party\apEx\Libraries\MVX\mvxPlayerLib_vs2019_releasestatic.lib ^
             /link /NODEFAULTLIB:libucrt.lib /NODEFAULTLIB:libvcruntime.lib ^
             msvcrt.lib legacy_stdio_definitions.lib oldnames.lib ^
             dsound.lib winmm.lib ^
             /OUT:mvx_render.exe
          dir mvx_render.exe

      - name: Render the music
        id: render
        # cmd, not bash: a loader failure (a missing import, say) surfaces as
        # exit 127 "command not found" under Git Bash, which says nothing about
        # why.  cmd prints the real Windows error.
        shell: cmd
        run: |
          dir demo\step010padding.mvm
          rem Two outputs: a WAV to listen to, and the tool's own SoundCache
          rem container, which the player discovers on its own.
          mvx_render.exe demo\step010padding.mvm cleanslate-music.wav cleanslate.apxsndcache
          if errorlevel 1 (
            echo ::error title=mvx_render failed::exit %errorlevel%
            exit /b 1
          )
          dir cleanslate-music.wav cleanslate.apxsndcache
          echo rendered=true>> "%GITHUB_OUTPUT%"

      - name: Check the render is real audio
        if: steps.render.outputs.rendered == 'true'
        shell: pwsh
        run: |
          # A song that came out as zeros would mean the harness linked but the
          # mixer never actually ran, which a byte count alone cannot tell.
          $bytes = [System.IO.File]::ReadAllBytes("cleanslate-music.wav")
          if ($bytes.Length -lt 44) { throw "the WAV is only $($bytes.Length) bytes" }
          $dataBytes = $bytes.Length - 44
          # 284 s of 44100 Hz stereo s16 is ~50 MB; anything wildly short means
          # the loop stopped early.
          if ($dataBytes -lt 40MB) { throw "only $dataBytes bytes of audio, expected ~50 MB" }

          $nonzero = 0; $peak = 0
          for ($i = 44; $i -lt $bytes.Length - 1; $i += 512) {
            # [int] first: ToInt16 returns Int16, and Abs(-32768) on Int16
            # throws "negating the minimum value of a twos complement number is
            # invalid" - which a clippy mix produces constantly.
            $v = [Math]::Abs([int][System.BitConverter]::ToInt16($bytes, $i))
            if ($v -ne 0) { $nonzero++ }
            if ($v -gt $peak) { $peak = $v }
          }
          Write-Host "non-zero probes: $nonzero, peak: $peak"
          if ($nonzero -eq 0) { throw "the rendered WAV is silent" }
          if ($peak -lt 1000) { throw "the rendered WAV peaks at only $peak, which is not music" }

          # The cache container must carry the same payload plus the tick markers.
          $c = [System.IO.File]::ReadAllBytes("cleanslate.apxsndcache")
          $magic = [System.Text.Encoding]::ASCII.GetString($c, 0, 4)
          if ($magic -ne "!CSA") { throw "cache magic is '$magic', expected '!CSA'" }
          Write-Host "cache: $($c.Length) bytes, magic ok"

      - name: Upload the rendered music
        if: steps.render.outputs.rendered == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cleanslate-music
          path: |
            cleanslate-music.wav
            cleanslate.apxsndcache
          # Three days, not thirty.  These two files are ~87 MB together and
          # nothing in the repository consumes them -- the macOS player reads a
          # track from disk when one is put next to the project.  Long enough to
          # grab after a run, short enough not to accumulate.
          retention-days: 3
